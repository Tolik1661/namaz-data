# Ежедневное обновление официальных расписаний намазов.
# Запускается по расписанию, парсит источники и коммитит изменённые JSON.
name: Update timetables

on:
  schedule:
    - cron: "0 3 * * *"   # каждый день в 03:00 UTC (06:00 МСК)
  workflow_dispatch: {}    # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse all sources
        id: parse
        # Сбой одного источника не должен лишать обновления все остальные города
        continue-on-error: true
        run: python scripts/build_all.py

      # Ворота перед коммитом: если данные битые — ничего не публикуем,
      # в репозитории остаются последние проверенные данные
      - name: Check data (audit + compatibility with released app versions)
        run: |
          python scripts/audit_timetables.py
          python scripts/compat/check_schema.py
          if command -v swift >/dev/null 2>&1; then
            swift scripts/compat/check_app_decoding.swift .
          else
            echo "Swift недоступен на раннере — проверка JSONDecoder пропущена, check_schema.py выполнен"
          fi

      - name: Commit & push if changed
        run: |
          git config user.name "namaz-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Автообновление расписаний: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Fail if some sources failed
        if: steps.parse.outcome == 'failure'
        run: |
          echo "::error::Часть источников не обновилась — подробности в шаге сбора данных"
          exit 1
