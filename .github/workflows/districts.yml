# Еженедельный полный прогон всех районов Турции (данные Diyanet на год вперёд)
name: Update Turkey districts

on:
  schedule:
    - cron: "0 4 * * 0"   # воскресенье 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

# Один публикующий прогон за раз (общая группа с update.yml): иначе второй push
# отклоняется как non-fast-forward и недельный результат по районам теряется
concurrency:
  group: namaz-data-publish
  cancel-in-progress: false

jobs:
  districts:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # Токен на запись не сохраняется в .git/config — он передаётся только в шаг Push
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4 (v4.4.0)
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5 (v5.6.0)
        with:
          python-version: "3.12"
      - name: Parse all sources incl. districts
        id: parse
        continue-on-error: true
        run: python scripts/build_all.py
        env:
          DIYANET_DISTRICTS: "1"

      # Ворота перед коммитом: если данные битые — ничего не публикуем,
      # в репозитории остаются последние проверенные данные
      - name: Check data (audit + compatibility with released app versions)
        run: |
          python scripts/audit_timetables.py
          python scripts/compat/check_schema.py
          if command -v swift >/dev/null 2>&1; then
            swift scripts/compat/check_app_decoding.swift .
          else
            echo "Swift недоступен на раннере — проверка JSONDecoder пропущена, check_schema.py выполнен"
          fi

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "namaz-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Районы Турции: еженедельное обновление $(date -u +%Y-%m-%d)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Прогон идёт около часа: за это время в main могли прийти коммиты. Без -X theirs:
      # конфликт с ручной правкой останавливает публикацию, а не затирает правку.
      # Результат rebase заново проходит те же ворота
      - name: Rebase onto fresh main and re-check
        if: steps.commit.outputs.changed == 'true'
        run: |
          git pull --rebase origin main || { git rebase --abort || true; exit 1; }
          python scripts/audit_timetables.py
          python scripts/compat/check_schema.py
          if command -v swift >/dev/null 2>&1; then
            swift scripts/compat/check_app_decoding.swift .
          fi

      - name: Push
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Fail if some sources failed
        if: steps.parse.outcome == 'failure'
        run: |
          echo "::error::Часть источников не обновилась — подробности в шаге сбора данных"
          exit 1
